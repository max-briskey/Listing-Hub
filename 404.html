<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Listings &amp; Open Houses Have Moved | Stevens Real Estate</title>
<meta name="description" content="Stevens Real Estate listings and open houses have moved to the SRE Portal at portal.stevensre.com/listings.">

<!-- Point search engines at the new home and keep this placeholder out of the index. -->
<link rel="canonical" href="https://portal.stevensre.com/listings">
<meta name="robots" content="noindex, follow">

<!-- Social preview -->
<meta property="og:type" content="website">
<meta property="og:title" content="Our listings and open houses have moved to the SRE Portal">
<meta property="og:description" content="Every active listing and upcoming open house is now in one place at portal.stevensre.com/listings.">
<meta property="og:url" content="https://portal.stevensre.com/listings">
<meta name="twitter:card" content="summary">

<style>
  :root{
    --bg:#0e0e0e;
    --panel:#161616;
    --gold:#c9a227;
    --gold-hi:#e0b93a;
    --text:#f5f5f5;
    --muted:#a8a8a8;
    --line:rgba(201,162,39,.25);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    background:var(--bg);
    color:var(--text);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    line-height:1.55;
  }
  .card{
    width:100%;
    max-width:640px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:56px 44px;
    text-align:center;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 28px;
  }
  h1{
    margin:0 0 18px;
    font-size:32px;
    line-height:1.25;
    font-weight:600;
    letter-spacing:.01em;
  }
  h1 .accent{color:var(--gold)}
  p{
    margin:0 auto 32px;
    max-width:44ch;
    font-size:17px;
    color:var(--muted);
  }
  .btn{
    display:inline-block;
    padding:15px 34px;
    background:var(--gold);
    color:#0e0e0e;
    font-size:15px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-decoration:none;
    border-radius:6px;
    transition:background .2s ease;
  }
  .btn:hover,.btn:focus{background:var(--gold-hi)}
  .btn:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
  .fallback{
    margin:26px 0 0;
    font-size:13px;
    color:#7d7d7d;
  }
  .fallback a{color:var(--gold);text-decoration:none;word-break:break-all}
  .fallback a:hover{text-decoration:underline}
  .rule{
    width:52px;height:2px;
    background:var(--gold);
    margin:0 auto 30px;
    border:0;
  }
  @media (max-width:520px){
    .card{padding:40px 24px}
    h1{font-size:25px}
    p{font-size:16px}
  }
</style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Stevens Real Estate</p>
    <hr class="rule">
    <h1>Our listings and open houses have moved to the <span class="accent">SRE Portal</span></h1>
    <p>You'll find every active listing and upcoming open house in one place.</p>
    <a class="btn" href="https://portal.stevensre.com/listings">Go to the SRE Portal</a>
    <p class="fallback">Or visit <a href="https://portal.stevensre.com/listings">portal.stevensre.com/listings</a></p>
  </main>
</body>
</html>
